<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Établi</title>
<meta name="theme-color" content="#3C3C3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : appli mobile, la semaine comme unité (3 cases + 2 petits), création express en un écran ; angles droits, thème clair uniquement */
:root{
  --paper:#F3F1E7; --cell:#FFFFFF; --ink:#1E1E1E; --muted:#6B6A62; --line:#CFCCBF; --grid:#E2DFD3; --head:#ECEAE0;
  --band:#3C3C3C; --band-ink:#FFFFFF;
  --hl:#FFECB0; --other:#E4E2DA; --pos:#2E7D32; --neg:#B23A2B; --urg:#D9452E; --star:#E3A21A;
  --scrim:rgba(30,30,30,.45);
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.top h1{font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .sub{font-family:var(--mono);font-size:.78rem;opacity:.75}
.top .btns{display:flex;gap:5px;flex:none}
.topbtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--band-ink);padding:5px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.topbtn.plus{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.note{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:.8rem}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{font-size:.86rem;color:var(--muted);padding:10px 12px}
.btn{border:1px solid var(--ink);padding:12px 16px;font-weight:700;background:var(--ink);color:var(--paper);width:100%}
.btn.ghost{background:var(--cell);color:var(--ink)}
.btn.warn{background:var(--cell);color:var(--neg);border-color:var(--neg)}
.sechead{background:var(--band);color:var(--band-ink);padding:8px 12px;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:20px;display:flex;justify-content:space-between;gap:10px}
.sechead span{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0}
.stars{color:var(--star);letter-spacing:-.05em;font-size:.9em;white-space:nowrap}
.stars .off{color:var(--line)}
.urg{background:var(--urg);color:#fff;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.tg{display:inline-block;border:1px solid currentColor;font-size:.7rem;font-weight:700;padding:0 5px;letter-spacing:.02em;white-space:nowrap}

/* Navigation de semaine */
.wknav{display:flex;align-items:stretch;border:1px solid var(--ink);margin:14px 0 12px;background:var(--cell)}
.wknav button{border:0;background:var(--cell);width:48px;font-size:1.2rem;flex:none}
.wknav button:first-child{border-right:1px solid var(--ink)}
.wknav button:last-child{border-left:1px solid var(--ink)}
.wknav .mid{flex:1;text-align:center;padding:8px 6px;min-width:0}
.wknav .mid b{display:block;font-size:1.05rem}
.wknav .mid span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.wknav .mid{background:var(--other)}
.wknav.cur .mid{background:var(--cell)}
.rule{font-size:.86rem;color:var(--muted);margin:0}
.rulerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.orgbtn{border:1px solid var(--ink);background:var(--cell);padding:6px 12px;font-weight:700;font-size:.85rem;flex:none}
.orgbtn.on{background:var(--ink);color:var(--paper)}
.orgbar{display:flex;border-top:1px solid var(--ink);background:var(--cell)}
.orgbar button{border:0;border-right:1px solid var(--ink);background:var(--cell);padding:10px 16px;font-weight:700;font-size:1rem}
.orgbar button[disabled]{color:var(--line)}
.orgbar .rm{margin-left:auto;border-right:0;border-left:1px solid var(--ink);color:var(--neg);font-size:.85rem}
.small .smx{align-self:flex-start;margin-top:4px;border:1px solid currentColor;background:transparent;color:inherit;font-size:.75rem;font-weight:700;padding:2px 7px}
.vrac{border:1px solid var(--line);border-top:0;background:var(--cell)}
.vrac .inline .input{border:0;border-top:1px solid var(--line)}
.vrac .inline .btn{border:0;border-top:1px solid var(--ink)}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:8px;padding:0 0 0 12px;border-top:1px solid var(--line);min-height:42px;font-size:.93rem}
.vlist li:first-child{border-top:0}
.vlist .t{flex:1;min-width:0;padding:8px 0}
.vlist .vb{border:1px solid var(--ink);background:var(--cell);padding:4px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.vlist .vx{border:0;border-left:1px solid var(--line);background:none;align-self:stretch;width:44px;font-size:1.05rem;color:var(--muted)}
.sheet .vrac{border-top:1px solid var(--ink);border-color:var(--ink)}
.kb{display:none}
body.kbd .kb{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;font-family:var(--mono);font-size:.7rem;font-weight:600;font-style:normal;background:var(--ink);color:var(--paper);line-height:1;flex:none;vertical-align:middle;letter-spacing:0;text-transform:none}
body.kbd .topbtn .kb{background:var(--band-ink);color:var(--band);margin-right:5px}
body.kbd .topbtn.plus .kb{background:var(--band);color:var(--band-ink)}
.tab{position:relative}
body.kbd .tab .kb{position:absolute;top:4px;right:6px}
body.kbd .tab[aria-current="page"] .kb{background:var(--paper);color:var(--ink)}
body.kbd .band .kb{background:var(--pt);color:var(--pc)}
body.kbd .xbtn .kb{background:currentColor;color:var(--pc,var(--band));margin-left:5px}
.vrac .inline .kb{align-self:center;margin:0 2px 0 10px}
body.kbd :focus{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 6px var(--hl)}
body.kbd .input:focus,body.kbd input:focus{box-shadow:inset 0 0 0 3px var(--hl)}
/* Mode mini (DumberOS, très petit écran) */
body.minimode .wrap>.note,body.minimode .tabs,body.minimode .top .btns{display:none}
body.minimode .top .in{padding-block:6px}
.mbig{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.mbig button{border:2px solid var(--ink);background:var(--cell);padding:9px 4px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
.mbig button.dark{background:var(--ink);color:var(--paper)}
body.kbd .mbig button.dark .kb{background:var(--paper);color:var(--ink)}
.mlbl{margin-top:10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
body.minimode .mrows{margin-top:4px;gap:4px}
body.minimode .mrow{height:44px}
.mnote{margin:6px 0 0;font-size:.78rem;color:var(--muted)}
body.minimode::before{background:var(--paper)}
body.minimode .wrap{padding-block:8px 8px}
.mhead{display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--other);height:38px}
.mhead.cur{background:var(--cell)}
.mhead button{border:0;background:var(--cell);padding:0 8px;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:5px}
.mhead .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem;border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--mono);min-width:0;white-space:nowrap;overflow:hidden}
.mhead .mid b{font-family:var(--body);font-size:1rem}
.mrows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--pc);color:var(--pt);padding:0 8px;height:52px;text-align:left;min-width:0;width:100%}
.mrow .emo{font-size:1.3rem}
.mrow .kb{background:var(--pt)!important;color:var(--pc)!important}
.mrow .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.mrow .tx b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small{font-size:.76rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.free{--pc:transparent;--pt:var(--muted);border-style:dashed;border-color:var(--muted)}
.mrow.free .kb{background:var(--muted)!important;color:var(--paper)!important}
.mchips{display:flex;gap:5px;margin-top:5px}
.mchip{flex:1;min-width:0;border:1px solid var(--ink);background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.minline{display:flex;align-items:center;margin-top:6px;border:1px solid var(--ink);background:var(--cell)}
.minline .kb{margin-left:8px}
.minline .input{border:0;padding:9px 8px;font-size:.92rem}
.minline .btn{width:auto;border:0;border-left:1px solid var(--ink);padding:9px 13px}
.mkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.mkeys button{border:1px solid var(--ink);background:var(--cell);font-size:.76rem;font-weight:700;padding:6px 2px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.mmode{display:block;margin:6px auto 0;background:none;border:0;font-size:.74rem;color:var(--muted);text-decoration:underline}
.mback{margin:2px 0 8px}
.mback button{border:1px solid var(--ink);background:var(--cell);padding:6px 10px;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
body.minimode .sheet{max-height:100%}
body.minimode .shead{padding-block:8px}
body.minimode .shead h2{font-size:1.02rem}
body.minimode .shead .emo{font-size:1.4rem}
body.minimode .sbody{gap:12px;padding-top:10px}
body.minimode .gnav{margin-top:0}
.st-proch{background:#F8C9A0}
.wkline{display:flex;align-items:stretch;margin-top:14px;border:1px solid var(--ink);background:var(--cell)}
.wklab{border:0;border-right:1px solid var(--ink);background:var(--cell);padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-family:var(--mono);line-height:1.15}
.wklab b{font-size:.85rem}
.wklab span{font-size:.7rem;color:var(--muted)}
.wkchips{display:flex;flex-direction:column;gap:4px;padding:5px;min-width:0;flex:1;justify-content:center}
.wkchips .mini{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;display:block;padding:5px 8px}
.wkchips .mini.sm{font-weight:400;font-size:.78rem}
.ctrl{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.ctrl .chips{margin:0}
.ptable th.pth{position:sticky;left:0;z-index:3;background:var(--head);border-right:1px solid var(--ink);min-width:210px}
tbody tr.qrow{cursor:default}
.qrow td{background:var(--head);height:auto;padding:6px 0;white-space:nowrap}
.qrow .quad{position:sticky;left:10px;display:inline-flex;margin:0;padding-right:10px}
.tagfilter{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.tab .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--urg);color:#fff;font-family:var(--mono);font-size:.64rem;font-weight:600;min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center}
.vadd{margin-top:14px;border:1px solid var(--ink);background:var(--cell)}
.vadd .input{border:0}
.vadd .btn{border:0;border-left:1px solid var(--ink);width:auto;padding:0 18px}
.vlist .vt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 0;font-size:.95rem}
.vlist .vgo{color:var(--muted);padding:0 12px;font-size:1.1rem}
.vlist .vchk{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none}
.vlist li.done .vt{color:var(--muted);text-decoration:line-through}
.vlist li.empty{padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.optbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--ink);background:var(--cell);padding:10px 12px;text-align:left;width:100%}
.optbtn .oe{font-size:1.5rem;flex:none}
.optbtn .tx{display:flex;flex-direction:column;min-width:0}
.optbtn .tx span{font-size:.8rem;color:var(--muted)}
.wslots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wslots li{display:flex;align-items:stretch;gap:0}
.wslots .pickbtn{flex:1;min-width:0}
.wslots .wrm{border:1px solid var(--ink);border-left:0;background:var(--cell);color:var(--neg);font-weight:700;font-size:.8rem;padding:0 10px}
.wslots .slot.free{padding:12px}
.wkpick .wsep{background:var(--band);color:var(--band-ink);padding:4px 12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:600px){.ptable th.pth{min-width:132px;max-width:132px}}
.bravo{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(20,20,20,.55);cursor:pointer}
.bravo canvas{position:absolute;inset:0;width:100%;height:100%}
.bravobox{position:relative;background:var(--pc);color:var(--pt);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px 28px;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:calc(100% - 48px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bravobox .emo{font-size:2.4rem}
.bravobox b{font-family:var(--mono);font-size:2.4rem;letter-spacing:.12em;line-height:1}
.bravobox small{font-size:.9rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.bravobox{animation:none}}
.notesprev{border:1px solid var(--ink);background:var(--cell);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%}
.notesprev span{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.notesprev b{font-size:.85rem;margin-top:4px}
.nlist{list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:var(--cell)}
.nl{display:flex;align-items:center;padding-left:calc(var(--lv) * 22px);border-top:1px solid var(--grid)}
.nl:first-child{border-top:0}
.nb{width:30px;height:38px;flex:none;border:0;background:none;font-size:1rem;color:var(--muted);padding:0}
.nb.has{color:var(--ink);font-weight:700}
.ni{flex:1;min-width:0;border:0;background:transparent;padding:9px 8px 9px 0;font-size:1rem}
.ni:focus{outline:none;background:var(--hl)}
.nl.done .ni{text-decoration:line-through;color:var(--muted)}
.ntools{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);border-top:2px solid var(--ink);background:var(--cell);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ntools button{border:0;border-left:1px solid var(--line);background:var(--cell);padding:12px 0;font-size:1.15rem;font-weight:700}
.ntools button:first-child{border-left:0}
.sync{border:0;background:transparent;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:2px 6px;color:var(--band-ink);opacity:.9}
.sync.ok{color:#A8E6A0}.sync.pend{color:#FFD873}.sync.err{color:#FF9C8A}.sync.off{color:#D8D8D4}
.login{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{width:100%;max-width:360px;border:2px solid var(--ink);background:var(--cell);box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:8px}
.lbox h1{margin:0 0 4px;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase}
.lbox p{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
.lbox label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
.lbox .btn{margin-top:10px}
.lerr{color:var(--neg)!important;font-weight:700}
.tablebox,.gantt{scrollbar-width:none}
.tablebox::-webkit-scrollbar,.gantt::-webkit-scrollbar{display:none}
.sizes button[data-s="mini"]{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px}
.mgrp td{font-weight:700}
.mlist{list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:var(--cell)}
.mlist li{display:flex;align-items:center;gap:10px;padding-left:12px;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist .mt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 12px 9px 0;display:flex;flex-direction:column;gap:3px}
.mlist .mt b{font-size:.98rem}
.mlist li.empty{padding:12px}
.mminis{width:100%;margin-top:6px;border:2px solid var(--ink);background:var(--cell);padding:10px;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
body.minimode .minline .input{padding:13px 10px;font-size:1.05rem}
body.minimode .minline .btn{padding:13px 16px;font-size:1.1rem}
body.minimode .mbig button{padding:16px 6px;font-size:1.08rem}
body.minimode .mrow{height:52px}
body.minimode .mrow .tx b{font-size:1.02rem}
body.minimode .kb{min-width:22px;height:22px;font-size:.8rem}
body.minimode .top .sub{font-size:.95rem}
body.minimode .sync{font-size:.9rem}
body.minimode .mlbl{font-size:.82rem}
body.minimode .mrow .tx small{font-size:.9rem}
body.minimode .mnote{font-size:.95rem}
body.minimode .mmode{font-size:.95rem}
body.minimode .empty{font-size:1rem}
body.minimode .note,body.minimode .duehint{font-size:.95rem}
body.minimode .lbl,body.minimode .field>label,body.minimode .field>.lbl{font-size:.8rem}
body.minimode .meta{font-size:.85rem}
body.minimode .shead h2 small{font-size:.88rem}
body.minimode pre.sum{font-size:.92rem}
body.minimode .sizes span{font-size:.85rem}
body.minimode .toast{font-size:1rem}
.mdue{flex:none;font-family:var(--mono);font-size:.8rem;font-weight:600;padding:3px 6px;background:var(--pt);color:var(--pc);white-space:nowrap}
.mdue.u{background:var(--urg);color:#fff}
body.minimode .mdue{font-size:.88rem}
.dweek .d7 button.due{box-shadow:inset 0 0 0 3px var(--urg);color:var(--urg);font-weight:700}
.duebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid var(--ink);background:var(--cell);padding:8px 12px;font-size:.92rem}

.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

.tasks li.dragging{background:var(--hl);box-shadow:0 4px 0 var(--ink);position:relative;z-index:2}
.tasks li.done .tt{color:var(--muted);text-decoration:line-through}
.tedit{flex:1;min-width:0;padding:6px 8px;font-size:1rem}
.tdur{font-family:var(--mono);font-size:.78rem;font-weight:600;background:var(--head);border:1px solid var(--line);padding:0 4px;white-space:nowrap}
.tadm{font-size:.72rem;font-weight:700;background:var(--ink);color:var(--paper);padding:0 5px;text-transform:uppercase;letter-spacing:.05em}
.tfilt{margin-bottom:2px}
textarea.ni{resize:none;overflow:hidden;line-height:1.35;font-family:inherit;display:block;min-height:38px}
.tg.col,.tchip.col{display:inline-flex;align-items:center;gap:5px}

.durrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dfree{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--cell);padding:0 10px}

/* Cases de la semaine */

.wknext{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-top:0;background:var(--cell)}
.mini{background:var(--pc);color:var(--pt);padding:4px 8px;font-size:.84rem;font-weight:700;border:0;display:inline-flex;gap:5px;align-items:center}

/* Planning : jours en colonnes, projets en lignes */
.gnav{display:flex;align-items:stretch;border:1px solid var(--ink);margin:14px 0 10px;background:var(--cell)}

.gg{display:grid;grid-template-columns:repeat(var(--n),var(--cw));grid-template-rows:34px;flex:none}
.gg>*{grid-row:1;min-width:0}
.bgc{border-left:1px solid var(--grid)}
.bgc.mon{border-left:1px solid var(--line)}
.bgc.we{background:#EFEDE6}
.bgc.off{background:#F7CFE0}
.bgc.tod{background:#EDEBE3}
.hm .gg{grid-template-rows:26px;background:var(--band);color:var(--band-ink)}

.hw .gg{grid-template-rows:38px}
.hw .wk{border:0;border-left:1px solid var(--ink);background:var(--other);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;text-align:left;gap:1px}
.hw .wk.cur{background:var(--cell)}
.hw .wk b{font-family:var(--mono);font-size:.82rem}

.hw .wk span.full{color:var(--ink);font-weight:600}
.hd .gg{grid-template-rows:24px}
.hd .dn{display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;border-left:1px solid var(--grid);border-top:1px solid var(--line)}
.hd .dn.we{background:#E2DFD5}
.hd .dn.off{background:#EE9DC0}
.hd .dn.tod{background:var(--ink);color:#fff;font-weight:600}
.gbar{grid-row:1;margin:4px 0;border:0;background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:0 5px;display:flex;align-items:center;gap:4px;overflow:hidden;text-align:left;z-index:1;line-height:1.15}

.gbar.s{justify-content:center;padding:0}

.planlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px;align-items:center}

/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;scrollbar-width:none;padding-bottom:2px}

.chip{border:1px solid var(--ink);background:var(--cell);padding:7px 11px;font-size:.85rem;white-space:nowrap}

}
.st-cours{background:#F2A39C}.st-plan{background:var(--hl)}.st-attente{background:#D8D8D4}.st-fini{background:var(--cell)}
td .tg{margin-right:4px;color:var(--muted)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink)}

.input{width:100%;border:1px solid var(--ink);background:var(--cell);padding:10px 12px;font-size:1rem;min-width:0}
textarea.input{min-height:70px;resize:vertical}
.amount{display:flex;align-items:stretch}
.amount .input{font-family:var(--mono);font-size:1.5rem;text-align:center;border-left:0;border-right:0}

.tchip{border:1px solid var(--ink);background:var(--cell);padding:6px 10px;font-size:.86rem;font-weight:700}

.hbars{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-top:0;background:var(--cell)}
.hbars li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem}

/* Création express */
.namerow{display:flex;align-items:stretch}

.sizes b{font-family:var(--mono);font-size:1.2rem}
.sizes span{font-size:.76rem;color:var(--muted)}

.duehint{font-size:.82rem;color:var(--muted);margin:0}
details.more>summary{cursor:pointer;list-style:none;font-size:.86rem;font-weight:700;padding:8px 0;border-top:1px dashed var(--line)}

.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}

.emogrid button:active{background:var(--hl)}

/* Placement jours */
.daypick{display:flex;flex-direction:column;gap:10px}
.dweek{border:1px solid var(--ink);background:var(--cell)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--cell);border-top:2px solid var(--ink);box-shadow:0 120px 0 0 var(--cell);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* Panneau */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-top:2px solid var(--ink);padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}

@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{background:var(--pc,var(--band));color:var(--pt,var(--band-ink));padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}

function wkKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const y=t.getUTCFullYear(); const f=new Date(Date.UTC(y,0,4)); const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7); return y+'-W'+pad(w);}
function wkMon(k){const [y,w]=k.split('-W').map(Number); const m=monday(new Date(y,0,4)); m.setDate(m.getDate()+(w-1)*7); return m;}
function wkAdd(k,n){const m=wkMon(k); m.setDate(m.getDate()+7*n); return wkKey(m);}
const wkNum=k=>Number(k.split('-W')[1]);
function wkRange(k){const m=wkMon(k), e=new Date(m); e.setDate(e.getDate()+6); return fmtD(m)+' – '+fmtD(e);}
function wkDates(k){const m=wkMon(k), e=new Date(m); e.setDate(e.getDate()+6); return [iso(m),iso(e)];}

function ink(hex){const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255; const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4); return .2126*L(r)+.7152*L(g)+.0722*L(b)>.33?'#1E1E1E':'#FFFFFF';}

function inWeek(k){const ps=open().filter(p=>pWeeks(p).includes(k)); return {n:ps.filter(p=>!small(p)),s:ps.filter(small)};}

function quad(p){const i=p.imp===3,u=urgent(p); return i&&u?0:i?1:u?2:3;}
const QUADS=[['Important et urgent','#D9452E'],['Important','#E3A21A'],['Urgent','#F2A39C'],['Le reste','#D8D8D4']];

function slotCard(p,k){
  const n=p.tasks.length, d=p.tasks.filter(x=>x.d).length, h=hoursOf(p.id,k);
  const m=[starsHtml(p.imp)];
  if(isDay(p)){const [a,b]=wkDates(k); const ds=p.days.filter(x=>x>=a&&x<=b).sort(); m.push(`<span>${ds.map(dayLbl).join(' · ')}</span>`);}
  else {const ws=pWeeks(p); m.push(`<span>sem. ${ws.indexOf(k)+1}/${ws.length}</span>`);}
  if(p.due) m.push(`<span>⏱ ${fmt(p.due)}</span>`);
  m.push(urgHtml(p));
  return `<button class="slot" style="${pv(p)}" data-act="open" data-id="${p.id}">
   <div class="band"><span class="emo">${p.emoji}</span><span class="nm">${esc(p.name)}</span><span style="font-family:var(--mono);font-size:.74rem;font-weight:600">${durLbl(p)}</span></div>
   ${n?`<div class="prog"><i style="width:${Math.round(d/n*100)}%"></i></div>`:''}
   <div class="pbody">${p.next?`<p>${esc(p.next)}</p>`:''}<div class="meta">${m.join('')}</div></div></button>`;
}
function weekOrder(k,list){const o=(S.order&&S.order[k])||[]; return list.slice().sort((x,y)=>{const a=o.indexOf(x.id),b=o.indexOf(y.id); if(a<0&&b<0) return prioSort(x,y); if(a<0) return 1; if(b<0) return -1; return a-b;});}

/* Vue planning : une colonne par jour, une ligne par projet */
function vPlanning(){
  const tgt=ui.planStart||todayS, tD=parse(tgt), m0=monday(tD), k0=wkKey(m0);
  let lastP=tgt; open().forEach(p=>{ p.weeks.forEach(k=>{const e=wkDates(k)[1]; if(e>lastP) lastP=e;}); p.days.forEach(d=>{ if(d>lastP) lastP=d; }); });
  const W=Math.max(10,Math.ceil((parse(lastP)-m0)/864e5/7)+2), N=W*7;
  const pm=new Date(tD.getFullYear(),tD.getMonth()-1,1), nm=new Date(tD.getFullYear(),tD.getMonth()+1,1);
  const mlab=d=>MOIS_L[d.getMonth()]+(d.getFullYear()!==today.getFullYear()?' '+d.getFullYear():'');
  const dayS=[]; for(let i=0;i<N;i++){const d=new Date(m0); d.setDate(m0.getDate()+i); dayS.push(iso(d));}
  const idx=s=>dayS.indexOf(s), first=dayS[0], last=dayS[N-1];
  /* en-têtes */
  let mo='', curM=null, span=0, startI=0;
  dayS.forEach((s,i)=>{const m=s.slice(0,7); if(m!==curM){ if(curM) mo+=`<div class="mo" style="grid-column:${startI+1} / span ${span}">${MOIS_L[Number(curM.slice(5))-1]} ${curM.slice(0,4)}</div>`; curM=m; span=0; startI=i;} span++;});
  mo+=`<div class="mo" style="grid-column:${startI+1} / span ${span}">${MOIS_L[Number(curM.slice(5))-1]} ${curM.slice(0,4)}</div>`;
  let wk=''; for(let w=0;w<W;w++){const k=wkAdd(k0,w), c=inWeek(k), full=c.n.length>=MAXN; wk+=`<button class="wk${k===CUR?' cur':''}" style="grid-column:${w*7+1} / span 7" data-act="goWk" data-k="${k}"><b>S${wkNum(k)}</b><span class="${full?'full':''}">${c.n.length}/${MAXN}${c.s.length?' +'+c.s.length+'p':''}</span></button>`;}
  const dn=dayS.map((s,i)=>{const d=parse(s), we=d.getDay()===0||d.getDay()===6, off=offOn(s); return `<div class="dn${we?' we':''}${off?' off':''}${s===todayS?' tod':''}" style="grid-column:${i+1}"${off?` title="${esc(offLbl(s))}"`:''}>${d.getDate()}</div>`;}).join('');
  const bg=dayS.map((s,i)=>{const d=parse(s), we=d.getDay()===0||d.getDay()===6; return `<div class="bgc${i%7===0?' mon':''}${we?' we':''}${offOn(s)?' off':''}${s===todayS?' tod':''}" style="grid-column:${i+1}"></div>`;}).join('');
  /* lignes : chaque projet garde une seule ligne, rangé le plus haut possible ; un autre projet peut se glisser dans ses trous */
  const items=open().map(p=>{
    const cov=new Set();
    (p.days||[]).forEach(d=>{const i=idx(d); if(i>=0) cov.add(i);});
    (p.weeks||[]).forEach(k=>{const i=idx(iso(wkMon(k))); if(i>=0) for(let j=0;j<5;j++) cov.add(i+j);});
    const ix=[...cov].sort((x,y)=>x-y), segs=[];
    ix.forEach(i=>{const g=segs[segs.length-1]; if(g&&g[1]===i-1) g[1]=i; else segs.push([i,i]);});
    return {p,ix,segs,start:ix[0],len:ix.length};
  }).filter(r=>r.len).sort((x,y)=>x.start-y.start||y.len-x.len||prioSort(x.p,y.p));
  const lanes=[];
  items.forEach(it=>{
    let L=lanes.findIndex(occ=>it.ix.every(i=>!occ.has(i)));
    if(L<0){L=lanes.length; lanes.push(new Set());}
    it.ix.forEach(i=>lanes[L].add(i)); it.lane=L;
  });
  const rowHtml=lanes.map((occ,L)=>{
    const freeAfter=b=>{let n=0; for(let i=b+1;i<N&&n<10&&!occ.has(i);i++) n++; return n;};
    const bars=items.filter(it=>it.lane===L).map(({p,segs})=>{ let named=false;
      return segs.map(([a,b])=>{const len=b-a+1, long=len>=5; let out=`<button class="gbar${long?'':' s'}" style="${pv(p)};grid-column:${a+1} / span ${len}" data-act="open" data-id="${p.id}" title="${esc(p.name)}">${long?`<span class="ge">${p.emoji}</span><span class="gt">${esc(p.name)}</span>`:p.emoji}</button>`;
        if(long) named=true; else if(!named){const f=freeAfter(b); if(f>=3){out+=`<span class="glab" style="grid-column:${b+2} / span ${f}">${esc(p.name)}</span>`; named=true;}} return out;}).join('');
    }).join('');
    return `<div class="grow proj"><div class="gl"></div><div class="gg">${bg}${bars}</div></div>`;
  }).join('');
  const cw=inWeek(CUR), cwl=[...weekOrder(CUR,cw.n),...cw.s];
  $view.innerHTML=`<div class="wkline"><button class="wklab" data-act="goWk" data-k="${CUR}"><b>S${wkNum(CUR)}</b><span>${cw.n.length}/${MAXN}</span></button><div class="wkchips">${cwl.map(p=>`<button class="mini${small(p)?' sm':''}" style="${pv(p)}" data-act="open" data-id="${p.id}">${p.emoji} ${esc(p.name)}</button>`).join('')||'<span class="note" style="margin:0">Rien cette semaine.</span>'}</div></div>
  <div class="gnav"><button data-act="planM" data-d="${iso(pm)}">‹ ${mlab(pm)}</button><button class="mid" data-act="planM" data-d="">Aujourd'hui</button><button data-act="planM" data-d="${iso(nm)}">${mlab(nm)} ›</button></div>
  <div class="gantt" id="gantt"><div class="gin" style="--n:${N}">
   <div class="grow hm"><div class="gl"></div><div class="gg">${mo}</div></div>
   <div class="grow hw"><div class="gl" style="font-size:.7rem;font-family:var(--mono)">sem.</div><div class="gg">${wk}</div></div>
   <div class="grow hd"><div class="gl"></div><div class="gg">${dn}</div></div>
   ${rowHtml||`<div class="grow"><div class="gl"></div><div class="empty">Aucun projet placé sur cette période.</div></div>`}
  </div></div>
  <div class="planlegend"><span><b style="background:#EE9DC0"></b>vacances et congés</span><span><b style="background:#E2DFD5"></b>week-end</span><span>2/3 = cases prises dans la semaine</span></div>
  <p class="note">Touche une semaine en haut pour voir et remplir ses 3 cases, une barre pour ouvrir le projet. Glisse sur le côté pour avancer dans le temps.</p>
  <button class="btn ghost" data-act="offs">🏖️ Vacances et congés prévus${S.offs.length?' ('+S.offs.length+')':''}</button>`;
  const g=document.getElementById('gantt'), ti=idx(tgt); if(g&&ti>=0){ try{ g.scrollLeft=ti*28; }catch(e){} }
}

     ${opt('itemMini','📝','Mini projet','Moins d\'1 jour : ajouté à la liste des mini projets')}
     ${src!=='autre'?opt('itemTo',LISTS.autre.emoji,LISTS.autre.name,LISTS.autre.hint,'data-to="autre"'):''}
     ${src!=='inbox'?opt('itemTo','📥','Remettre en vrac','À trier plus tard','data-to="inbox"'):''}

/* Semaine (ouverte depuis le planning) */
function weekSheet(k,msg){

  const row=p=>`<li><button class="pickbtn" style="${pv(p)}" data-act="open" data-id="${p.id}"><span class="sw">${p.emoji}</span><span class="tx"><b>${esc(p.name)}</b><span class="meta">${starsHtml(p.imp)}<span>${durLbl(p)}</span>${p.weeks.includes(k)?'<span>lun–ven</span>':'<span>'+p.days.filter(x=>x>=a&&x<=b).sort().map(dayLbl).join(' · ')+'</span>'}${urgHtml(p)}</span></span></button><button class="wrm" data-act="rmWkS" data-id="${p.id}">Retirer</button></li>`;
  let n=ord.map(row).join(''); for(let i=c.n.length;i<MAXN;i++) n+=`<li><button class="slot free" data-act="fill" data-size="n" data-k="${k}"><span class="n">${i+1}</span>Choisir un projet</button></li>`;

  openSheet(`<div class="shead"><h2>Semaine ${wkNum(k)}<small>${wkRange(k)}${k===CUR?' · cette semaine':''}</small></h2><button class="xbtn" data-act="close">Fermer</button></div><div class="sbody">
  <div class="actions"><button class="btn ghost" data-act="wkS" data-k="${wkAdd(k,-1)}">‹ S${wkNum(wkAdd(k,-1))}</button><button class="btn ghost" data-act="wkS" data-k="${wkAdd(k,1)}">S${wkNum(wkAdd(k,1))} ›</button></div>
  ${msg||''}
  <div class="field"><span class="lbl">Projets · ${c.n.length}/${MAXN}</span><ul class="wslots">${n}</ul></div>
  <div class="field"><span class="lbl">Petits projets · ${c.s.length}/${MAXS}</span><ul class="wslots">${sm}</ul></div></div>`,'w:'+k);
}

/* Panneaux */
const $scrim=document.getElementById('scrim'), $sheet=document.getElementById('sheet');
let sheetId=null, ctx=null, draft=null;

function openSheet(html,key){ const keep=!$scrim.hidden&&key&&key===sheetKey; const st=$sheet.scrollTop; const opened=keep?[...$sheet.querySelectorAll('details')].map(d=>d.open):null; $sheet.innerHTML=html; $scrim.hidden=false; if(keep){ $sheet.querySelectorAll('details').forEach((d,i)=>{ if(opened[i]!=null) d.open=opened[i]; }); $sheet.scrollTop=st; } else $sheet.scrollTop=0; sheetKey=key||null; }

function removeFromWeek(p,k){ const [a,b]=wkDates(k); p.days=p.days.filter(d=>d<a||d>b); p.weeks=p.weeks.filter(w=>w!==k); }

function starPick(cur,act){return `<div class="starpick">${[1,2,3].map(n=>`<button data-act="${act}" data-n="${n}" class="${n<=cur?'on':''}" aria-label="${IMP[n]}">★</button>`).join('')}<span class="cap">${IMP[cur]}</span></div>`;}
const TASK_DUR=/\((\d+(?:[.,]\d+)?)\s*(min|h|j)\)/i;
function parseTask(t){ const m=String(t).match(TASK_DUR); let mins=null; if(m){ const v=parseFloat(m[1].replace(',','.')), u=m[2].toLowerCase(); mins=u==='min'?v:u==='h'?v*60:v*480; } return {mins, admin:/(^|\s)@admin\b/i.test(t)}; }
function fmtMins(m){ if(!m) return ''; if(m>=480&&m%480===0) return (m/480)+' j'; const h=Math.floor(m/60), r=Math.round(m%60); return h?(h+' h'+(r?' '+String(r).padStart(2,'0'):'')):r+' min'; }
function taskText(t){ return esc(t).replace(/\((\d+(?:[.,]\d+)?)\s*(min|h|j)\)/ig,'<span class="tdur">$1 $2</span>').replace(/(^|\s)@admin\b/ig,'$1<span class="tadm">admin</span>'); }
function tasksBlock(p,closed,word){
  const all=p.tasks.map((x,i)=>({x,i})), adminN=all.filter(o=>parseTask(o.x.t).admin).length, only=!!(ui.taskAdmin&&adminN);
  const list=only?all.filter(o=>parseTask(o.x.t).admin):all, n=p.tasks.length, d=p.tasks.filter(x=>x.d).length;
  const rest=all.filter(o=>!o.x.d).reduce((a,o)=>a+(parseTask(o.x.t).mins||0),0);
  return `<div class="field"><span class="lbl">${word==='étape'?'Étapes':'Tâches'} ${n?d+'/'+n:''}${rest?' · reste ≈ '+fmtMins(rest):''}</span>
   ${adminN?`<div class="seg tfilt"><button data-act="tfilt" data-v="0" aria-pressed="${!only}">Toutes</button><button data-act="tfilt" data-v="1" aria-pressed="${only}">Admin (${adminN})</button></div>`:''}
   ${list.length?`<ul class="list tasks" data-pid="${p.id}">${list.map(({x,i})=>`<li class="${x.d?'done':''}" data-i="${i}"><input type="checkbox" data-act="task" data-i="${i}" ${x.d?'checked':''} ${closed?'disabled':''} aria-label="Valider la ${word}"><span class="t tt" data-act="tedit" data-i="${i}">${taskText(x.t)}</span>${closed||only?'':'<span class="drag" aria-label="Glisser pour déplacer">≡</span>'}</li>`).join('')}</ul>`:''}
   ${closed?'':`<form class="inline" data-act="addTask"><input class="input" id="f-task" placeholder="Nouvelle ${word}" aria-label="Nouvelle ${word}"><button class="btn" type="submit">+</button></form><p class="note" style="margin:0">Durée entre parenthèses : (30min), (2h), (1j) — 1j compte 8 h. Ajoute @admin pour une tâche administrative.</p>`}</div>`;
}
function durPick(isM,dur,act){ return `<div class="durrow"><label class="dfree${isM?'':' on'}"><input class="input" type="number" min="0.5" step="0.5" inputmode="decimal" data-durother="${act}" value="${!isM&&dur!=null?dur:''}" placeholder="—" aria-label="Durée en jours"><span>jour(s)</span></label><button class="dmini" data-act="${act}" data-v="mini" aria-pressed="${isM}">Moins d'1 jour<small>→ mini projet</small></button></div>`; }
function applyDur(p,v){ if(v!=='mini'&&Number(v)<1) v='mini'; if(v==='mini'){ p.size='mini'; p.dur=null; p.emoji=''; p.color=MINI_COLOR; p.weeks=[]; p.days=[]; return; } const n=Number(v); if(!(n>0)) return; if(isMini(p)){ if(!p.emoji) p.emoji='✨'; if(p.color===MINI_COLOR) p.color=COLORS[Math.floor(Math.random()*COLORS.length)]; } p.size='proj'; p.dur=n; }
function sizePick(cur,act){return `<div class="sizes">${Object.entries(SIZES).map(([k,s])=>`<button data-act="${act}" data-s="${k}" aria-pressed="${cur===k}"><b>${s.l}</b><span>${s.sub}</span></button>`).join('')}</div>`;}
function tagPick(sel,act){return `<div class="pchips">${S.tags.map(t=>`<button class="tchip${t.color?' col':''}"${tcs(t)} data-act="${act}" data-t="${t.id}" aria-pressed="${sel.includes(t.id)}">${esc(t.name)}</button>`).join('')}</div>
  <form class="inline" data-act="newTag" data-for="${act}"><input class="input" id="f-tag" placeholder="Nouveau tag" aria-label="Nouveau tag" maxlength="20"><button class="btn" type="submit">+</button></form>`;}
function dueHint(due){ if(!due) return 'Pas d\'échéance, pas d\'urgence.'; const n=days(due); return n<0?'Échéance dépassée : urgent.':n<=URG?'À '+n+' jours : compté comme urgent.':'À '+n+' jours : pas encore urgent.'; }

/* Création express */
function newSheet(keep){
  if(!keep||!draft) draft={name:'',emoji:'✨',picked:false,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:'proj',dur:5,imp:2,due:'',tags:[],why:''};
  if(ctx&&ctx.size==='s'&&!keep) draft.dur=1;
  const d=draft;
  openSheet(`<div class="shead"><h2>Nouveau projet<small>${ctx?'pour la semaine '+wkNum(ctx.k):'il ira dans « À planifier »'}</small></h2><button class="xbtn" data-act="close">Fermer</button></div><div class="sbody">
   <div class="namerow" style="--pc:${d.color}">${d.size==='mini'?'':`<button class="emobtn" data-act="emojiPick" data-for="new" aria-label="Choisir un émoji" id="nemo">${d.emoji}</button>`}<input class="input" id="n-name" placeholder="Ex. Monter le tunnel de semis" value="${esc(d.name)}" aria-label="Nom du projet"></div>
   <div class="field"><span class="lbl">Durée en jours de travail</span>${durPick(d.size==='mini',d.dur,'ndur')}</div>
   <div class="field"><span class="lbl">Importance</span>${starPick(d.imp,'nimp')}</div>
   <div class="field"><label for="n-due">Échéance (facultatif)</label><div class="duerow"><input class="input" type="date" id="n-due" value="${d.due}"><button data-act="nodue">Aucune</button></div><p class="duehint" id="n-duehint">${dueHint(d.due)}</p></div>
   ${d.size==='mini'?'':`<div class="field"><span class="lbl">Tags</span>${tagPick(d.tags,'ntag')}</div>
   <details class="more"><summary>Plus de détails</summary>
    <div class="field"><label for="n-why">Pourquoi ce projet</label><input class="input" id="n-why" value="${esc(d.why)}" placeholder="Ce que tu veux en retirer"></div>
    <div class="field"><span class="lbl">Couleur</span><div class="swatches">${COLORS.map(c=>`<button style="--sw:${c}" data-act="ncolor" data-c="${c}" aria-pressed="${d.color===c}" aria-label="Couleur ${c}"></button>`).join('')}</div></div>
   </details>`}
   <button class="btn" data-act="create">Créer${ctx?' et placer':''}</button></div>`,'new');
  if(!keep) setTimeout(()=>{const n=document.getElementById('n-name'); if(n) try{n.focus();}catch(e){}},60);
}
function syncDraft(){ if(!draft) return; const di=document.querySelector('[data-durother=ndur]'); if(di&&di.value){ const v=parseFloat(String(di.value).replace(',','.')); if(v>0){ if(v<1) draft.size='mini'; else { draft.size='proj'; draft.dur=v; } } } const g=id=>document.getElementById(id); if(g('n-name')) draft.name=g('n-name').value; if(g('n-due')) draft.due=g('n-due').value; if(g('n-why')) draft.why=g('n-why').value; }

/* Choix d'émoji */

function emojiSheet(forWhat){
  emojiFor=forWhat; if(forWhat==='new') syncDraft();
  openSheet(`<div class="shead"><h2>Choisir un émoji</h2><button class="xbtn" data-act="emojiBack">Retour</button></div><div class="sbody">
   <div class="chips" style="margin:0;position:sticky;top:0;z-index:1;background:var(--paper);padding:6px 0">${EMOJIS.map(([cat],i)=>`<button class="chip" data-act="emojiJump" data-i="${i}">${cat}</button>`).join('')}</div>
   ${EMOJIS.map(([cat,list],i)=>`<div id="ecat-${i}"><span class="lbl">${cat}</span><div class="emogrid" style="margin-top:4px">${Array.from(new Intl.Segmenter?new Intl.Segmenter('fr',{granularity:'grapheme'}).segment(list):list).map(s=>typeof s==='string'?s:s.segment).map(e=>`<button data-act="emojiSet" data-e="${e}">${e}</button>`).join('')}</div></div>`).join('')}
   <form class="inline" data-act="emojiOther"><input class="input" id="f-emo" placeholder="Autre émoji (clavier)" aria-label="Autre émoji" maxlength="8"><button class="btn" type="submit">OK</button></form>
  </div>`,'emo');
}
function emojiDone(e){ if(emojiFor==='new'){ if(e){draft.emoji=e; draft.picked=true;} newSheet(true);} else { const p=P(emojiFor); if(e){p.emoji=e; save();} detail(p.id);} }

/* Fiche projet */
let lastDetail=null;
function detail(id,msg){
  const p=P(id); if(!p) return; if(lastDetail!==id){ ui.taskAdmin=false; lastDetail=id; } sheetId=id; ctx=null; draft=null; placeMode=null;
  if(isMini(p)){ detailMini(p,msg); return; }
  const st=state(p), closed=!!p.closed, n=p.tasks.length, d=p.tasks.filter(x=>x.d).length, mo=money(id), h=hoursOf(id);
  const placed=[...p.weeks.map(w=>({k:w,l:'S'+wkNum(w)+' · lun–ven '+wkRange(w).split(' – ')[0],w,o:iso(wkMon(w))})),...p.days.map(x=>({k:x,l:dayLbl(x)+' '+MOIS[parse(x).getMonth()],w:wkKey(parse(x)),o:x}))].sort((u,v)=>u.o.localeCompare(v.o));
  openSheet(`<div class="shead" style="${pv(p)}"><button class="emo" data-act="emojiPick" data-for="${p.id}" aria-label="Changer l'émoji">${p.emoji}</button><h2>${esc(p.name)}<small>${durLbl(p)} · ${IMP[p.imp]}</small></h2><button class="xbtn" data-act="close">Fermer</button></div><div class="sbody">
  <div><span class="state st-${st}">${STATE[st]}</span>${urgHtml(p)} ${tagsHtml(p)}</div>
  ${closed?`<div class="bilan"><span class="lbl">Clôturé le ${fmt(p.closed)}</span>${p.bilan&&p.bilan.learn?`<p><b>Ce que j'en retire.</b> ${esc(p.bilan.learn)}</p>`:''}${p.bilan&&p.bilan.diff?`<p><b>À refaire autrement.</b> ${esc(p.bilan.diff)}</p>`:''}${!(p.bilan&&(p.bilan.learn||p.bilan.diff))?'<p>Pas de bilan noté.</p>':''}</div>`:''}
  ${msg&&msg!=='del'?msg:''}
  ${tasksBlock(p,closed,'tâche')}
  <div class="field"><span class="lbl">Placement · ${placed.length}</span>
    ${placed.length?`<ul class="list">${placed.map(x=>`<li><span class="t" style="font-family:var(--mono);font-size:.88rem">${x.l}${x.w===CUR?' <span class="state" style="background:var(--hl);font-size:.7rem;padding:1px 5px">cette sem.</span>':''}</span>${closed?'':`<button class="x" data-act="unplace" data-k="${x.k}" aria-label="Retirer">×</button>`}</li>`).join('')}</ul>`:'<p class="note" style="margin:0">Pas encore placé.</p>'}
    ${closed?'':`<div class="actions"><button class="btn ghost" data-act="place" data-m="j">Par jours</button><button class="btn ghost" data-act="place" data-m="s">Par semaines</button></div>`}
    ${durOf(p)>=20&&!closed?'<p class="note" style="margin:0">Projet d\'un mois ou plus : note ses grandes étapes dans les tâches.</p>':''}</div>
  ${closed?'':`<div class="field"><label for="f-next">Prochaine action</label><input class="input" id="f-next" data-field="next" value="${esc(p.next)}" placeholder="Le prochain geste concret"></div>

  <div class="field"><span class="lbl">Importance</span>${starPick(p.imp,'imp')}</div>
  <div class="field"><label for="f-due">Échéance</label><div class="duerow"><input class="input" type="date" id="f-due" data-field="due" value="${p.due||''}"><button data-act="clearDue">Aucune</button></div><p class="duehint">${dueHint(p.due)}</p></div>
  <div class="field"><span class="lbl">Durée en jours de travail</span>${durPick(false,p.dur,'dur')}</div>
  <div class="field"><span class="lbl">Tags</span>${tagPick(p.tags,'tag')}</div>`}
  <div class="field"><span class="lbl">Notes</span>${p.notes&&p.notes.some(x=>x.t)?`<button class="notesprev" data-act="notes">${p.notes.filter(x=>x.t).slice(0,3).map(x=>`<span style="padding-left:${x.l*14}px">• ${esc(x.t)}</span>`).join('')}<b>Ouvrir les notes · ${p.notes.filter(x=>x.t).length} ligne${p.notes.filter(x=>x.t).length>1?'s':''}</b></button>`:`<button class="btn ghost" data-act="notes">+ Feuille de notes</button>`}</div>
  <details class="more" ${p.why?'open':''}><summary>Pourquoi, dossier, couleur</summary>
  <div class="field"><label for="f-why">Pourquoi ce projet</label><textarea class="input" id="f-why" data-field="why" ${closed?'disabled':''}>${esc(p.why)}</textarea></div>
  <div class="field"><span class="lbl">Dossier sur l'ordi</span>${p.folder?`<div class="folder"><code id="fpath">${esc(folderPath(p))}</code><button data-act="copyPath">Copier</button></div>`:`<button class="btn ghost" data-act="mkFolder">Créer un dossier pour ce projet</button>`}</div>
  ${closed?'':`<div class="field"><span class="lbl">Couleur</span><div class="swatches">${COLORS.map(c=>`<button style="--sw:${c}" data-act="color" data-c="${c}" aria-pressed="${p.color===c}" aria-label="Couleur ${c}"></button>`).join('')}</div></div>`}
  </details>
  ${closed?`<button class="btn ghost" data-act="reopen">Rouvrir le projet</button>`:`<div class="actions"><button class="btn ghost" data-act="projSave">Valider</button><button class="btn" data-act="closeStart">Clôturer le projet</button></div>`}
  ${msg==='del'?`<div class="danger"><div>Supprimer <b>${p.emoji} ${esc(p.name)}</b> définitivement ? Pour garder une trace, clôture-le plutôt.</div><div class="actions"><button class="btn ghost" data-act="back">Annuler</button><button class="btn warn" data-act="delOk">Supprimer</button></div></div>`:`<button class="linkbtn" style="align-self:center;color:var(--neg)" data-act="delAsk">Supprimer le projet</button>`}
  </div>`,'d:'+id);
}

/* Placement */
let placeMode=null;
function placeSheet(id,msg,startK){
  const p=P(id); sheetId=id;
  const back=ctx&&ctx.fromFill?`backWeek" data-k="${ctx.k}`:'back';
  const mode=placeMode||(isDay(p)?'j':'s');
  const modeSeg=`<div class="seg"><button data-act="pmode" data-m="j" aria-pressed="${mode==='j'}">Par jours</button><button data-act="pmode" data-m="s" aria-pressed="${mode==='s'}">Par semaines (lun–ven)</button></div>`;
  if(mode==='j'){
    const k0=startK||(ctx&&ctx.k)||CUR;
    let html=''; for(let i=0;i<4;i++){const k=wkAdd(k0,i), m=wkMon(k), c=inWeek(k), has=pWeeks(p).includes(k), full=!has&&!canAdd(p,k);
      html+=`<div class="dweek"><div class="h"><b>S${wkNum(k)}</b><span>${wkRange(k)}</span>${full?'<span class="full">pleine</span>':`<span>${small(p)?c.s.length+'/'+MAXS+' petits':c.n.length+'/'+MAXN}</span>`}</div><div class="d7">${JR.map((j,di)=>{const dt=new Date(m); dt.setDate(m.getDate()+di); const s=iso(dt); const on=p.days.includes(s); return `<button data-act="toggleDay" data-d="${s}" data-k="${k}" class="${on?'on':''}${di>4?' we':''}${offOn(s)?' off':''}${p.due===s?' due':''}"${p.due===s?' title="Échéance"':''}>${p.due===s?'⏱':j}<b>${dt.getDate()}</b></button>`;}).join('')}</div></div>`;}
    openSheet(`<div class="shead" style="${pv(p)}"><span class="emo">${p.emoji}</span><h2>Placer<small>${esc(p.name)} · ${durLbl(p)}</small></h2><button class="xbtn" data-act="${back}">OK</button></div><div class="sbody">
    ${modeSeg}
    ${p.due?`<div class="duebar">⏱ Échéance : <b>${fmt(p.due)} ${parse(p.due).getFullYear()}</b>${urgHtml(p)}</div>`:''}
    ${msg||''}<p class="note" style="margin:0">Touche les jours où tu y travailles. ${small(p)?'Un petit projet ne prend pas de case de la semaine.':'Il prend une des 3 cases des semaines touchées.'}</p>
    <div class="daypick" style="${pv(p)}">${html}</div>
    <div class="actions"><button class="btn ghost" data-act="dayShift" data-d="-4" data-k="${k0}">‹ Avant</button><button class="btn ghost" data-act="dayShift" data-d="4" data-k="${k0}">Après ›</button></div></div>`,'pd:'+id);
  } else {
    let li='', lm=-1; for(let i=0;i<53;i++){const k=wkAdd(CUR,i), c=inWeek(k), has=p.weeks.includes(k), ok=has||canAdd(p,k);
      const th=wkMon(k); th.setDate(th.getDate()+3); if(th.getMonth()!==lm){lm=th.getMonth(); li+=`<li class="wsep">${MOIS_L[lm]} ${th.getFullYear()}</li>`;}
      li+=`<li><button data-act="toggleWk" data-k="${k}" class="${has?'in':''}"><span><b>S${wkNum(k)}</b><br><span class="note" style="margin:0">${fmtD(wkMon(k))}</span></span><span class="ems">${[...c.n,...c.s].map(x=>`<i style="${pv(x)}" title="${esc(x.name)}">${x.emoji}</i>`).join('')}</span><span class="cap">${p.due&&p.due>=wkDates(k)[0]&&p.due<=wkDates(k)[1]?'<b class="wdue">⏱ '+fmt(p.due)+'</b> ':''}${has?'✓ placé':ok?c.n.length+'/'+MAXN:'pleine'}</span></button></li>`;}
    openSheet(`<div class="shead" style="${pv(p)}"><span class="emo">${p.emoji}</span><h2>Placer<small>${esc(p.name)} · ${durLbl(p)}</small></h2><button class="xbtn" data-act="${back}">OK</button></div><div class="sbody">
    ${modeSeg}
    ${p.due?`<div class="duebar">⏱ Échéance : <b>${fmt(p.due)} ${parse(p.due).getFullYear()}</b>${urgHtml(p)}</div>`:''}
    ${msg||''}<p class="note" style="margin:0">Touche une semaine pour l'ajouter ou la retirer. Elle occupe les 5 jours ouvrables sur le planning.</p><ul class="wkpick">${li}</ul></div>`,'pw:'+id);
  }
}
function fillWeek(k,size,msg){
  ctx={k,size,fromFill:true}; sheetId=null;
  const c=inWeek(k), list=open().filter(p=>!isMini(p)&&!pWeeks(p).includes(k)&&(size==='s'?small(p):!small(p))).sort(prioSort);
  let html='', lastQ=-1;
  list.forEach(p=>{const q=quad(p); if(q!==lastQ){lastQ=q; html+=`<span class="quad"><i style="background:${QUADS[q][1]}"></i>${QUADS[q][0]}</span>`;}
    const inPrev=pWeeks(p).includes(wkAdd(k,-1));
    html+=`<button class="pickbtn" style="${pv(p)}" data-act="addToWk" data-id="${p.id}"><span class="sw">${p.emoji}</span><span class="tx"><b>${esc(p.name)}</b><span class="meta">${starsHtml(p.imp)}<span>${durLbl(p)}</span>${p.due?`<span>⏱ ${fmt(p.due)}</span>`:''}${inPrev?'<span>suite de la sem. d\'avant</span>':''}${urgHtml(p)}</span></span></button>`;});
  openSheet(`<div class="shead"><h2>${size==='s'?'Petit projet':'Projet'} pour la semaine ${wkNum(k)}<small>${wkRange(k)} · ${size==='s'?c.s.length+'/'+MAXS:c.n.length+'/'+MAXN}</small></h2><button class="xbtn" data-act="backWeek" data-k="${k}">Retour</button></div><div class="sbody">
  ${msg||''}
  <button class="btn" data-act="new">+ Nouveau projet</button>
  <div class="picklist">${html||'<p class="empty">Aucun projet de cette taille à placer.</p>'}</div></div>`,'f:'+k+size);
}
function closeFlow(id){const p=P(id);
  openSheet(`<div class="shead" style="${pv(p)}"><span class="emo">${p.emoji}</span><h2>Clôturer<small>${esc(p.name)}</small></h2><button class="xbtn" data-act="back">Retour</button></div><div class="sbody">
    <div class="field"><label for="f-learn">Ce que j'en retire</label><textarea class="input" id="f-learn" placeholder="Une ou deux phrases suffisent"></textarea></div>
    <div class="field"><label for="f-diff">Ce que je ferais autrement</label><textarea class="input" id="f-diff" placeholder="Prévu ${durLbl(p)}. Et en vrai ?"></textarea></div>
    ${p.folder?`<div class="folder"><code>~/Projets/${esc(p.folder)} → ~/Projets/_Archives/${todayS.slice(0,4)}/${esc(p.folder)}</code></div><p class="note" style="margin:0">Dans la vraie version, le dossier sera déplacé automatiquement.</p>`:''}
    <div class="actions"><button class="btn ghost" data-act="back">Annuler</button><button class="btn" data-act="closeDo">Clôturer et archiver</button></div></div>`);}
function summary(){
  render();
  const c=inWeek(CUR), nk=wkAdd(CUR,1), nx=inWeek(nk); const [a,b]=wkDates(CUR);
  const L=['Semaine '+wkNum(CUR)+' ('+wkRange(CUR)+')','','PROJETS DE LA SEMAINE ('+c.n.length+'/'+MAXN+')'];
  c.n.sort(prioSort).forEach(p=>L.push('- '+p.emoji+' '+p.name+' ['+'★'.repeat(p.imp)+(urgent(p)?' · urgent':'')+'] → '+(p.next||'prochaine action à définir')));
  if(c.s.length){L.push('PETITS'); c.s.forEach(p=>L.push('- '+p.emoji+' '+p.name+(p.next?' → '+p.next:'')));}
  L.push('','SEMAINE '+wkNum(nk)+' PRÉVUE'); const nn=[...nx.n,...nx.s]; if(nn.length) nn.forEach(p=>L.push('- '+p.emoji+' '+p.name+(small(p)?' (petit)':''))); else L.push('- rien encore');
  const pool=open().filter(p=>!isMini(p)&&state(p)==='attente'&&quad(p)<=1).sort(prioSort);

function bravo(p){
  const big=durOf(p)>=20;
  const wrap=document.createElement('div'); wrap.className='bravo'+(big?' big':'');
  wrap.innerHTML=`<canvas></canvas><div class="bravobox" style="${pv(p)}"><span class="emo">${p.emoji}</span><b>${big?'BRAVO !!!':'BRAVO'}</b>${big?'<i>Plus d\'un mois de travail, c\'est fait.</i>':''}<small>${esc(p.name)}</small></div>`;
  document.body.appendChild(wrap);
  const end=()=>{ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); };
  wrap.addEventListener('click',end);
  let reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  const cv=wrap.querySelector('canvas'); let ctx2=null; try{ctx2=cv.getContext('2d');}catch(e){}
  if(reduce||!ctx2){ wrap.classList.add('calm'); setTimeout(end,big?3000:1600); return; }
  const W=cv.width=innerWidth, H=cv.height=innerHeight, cols=[p.color,'#F5CF4E','#E0574F','#4A86D9','#5BAE5B','#F07F9E','#FFFFFF'];
  const parts=[]; let t=0;
  const burst=(x,y)=>{ for(let i=0;i<46;i++){ const a=Math.PI*2*i/46+Math.random()*.2, v=2+Math.random()*4.5; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[(Math.random()*cols.length)|0],l:60+Math.random()*30,s:3+((Math.random()*3)|0)}); } };
  let shots=[[.25,.3,0],[.75,.25,14],[.5,.18,26],[.2,.55,40],[.8,.5,50],[.5,.42,62]];
  if(big){ shots=[]; for(let i=0;i<26;i++) shots.push([.1+Math.random()*.8,.1+Math.random()*.55,i*13]); }
  (function frame(){ if(!wrap.parentNode) return; t++;
    shots.forEach(([fx,fy,at])=>{ if(t===at+1) burst(W*fx,H*fy); });
    ctx2.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx; q.y+=q.vy; q.vy+=.06; q.vx*=.985; q.l--; if(q.l<=0){parts.splice(i,1); continue;} ctx2.globalAlpha=Math.min(1,q.l/30); ctx2.fillStyle=q.c; ctx2.fillRect(q.x,q.y,q.s,q.s); }
    ctx2.globalAlpha=1;
    if(t<(big?420:150)) requestAnimationFrame(frame); else end();
  })();
}

  $sheet.querySelectorAll('textarea.ni').forEach(autoH);

function autoH(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function nBlock(N,i){let j=i; while(j+1<N.length&&N[j+1].l>N[i].l) j++; return j;}
function nAct(a,nid){
  const p=P(ctx&&ctx.notes); if(!p||!nid) return; const N=p.notes, i=N.findIndex(x=>x.id===nid); if(i<0) return;
  const j=nBlock(N,i), blk=N.slice(i,j+1);
  if(a==='nIn'){ if(i>0&&N[i].l<=N[i-1].l) blk.forEach(x=>x.l++); }
  else if(a==='nOut'){ if(N[i].l>0) blk.forEach(x=>x.l--); }
  else if(a==='nUp'){ let k=i-1; while(k>=0&&N[k].l>N[i].l) k--; if(k>=0&&N[k].l===N[i].l){ N.splice(i,blk.length); N.splice(k,0,...blk); } }
  else if(a==='nDown'){ const k=j+1; if(k<N.length&&N[k].l===N[i].l){ const m=nBlock(N,k); const other=N.slice(k,m+1); N.splice(i,blk.length+other.length,...other,...blk); } }
  else if(a==='nDone'){ N[i].d=!N[i].d; }
  else if(a==='nCol'){ N[i].c=!N[i].c; }
  else if(a==='nDel'){ N.splice(i,blk.length); if(!N.length) N.push({id:'n'+Date.now(),t:'',l:0}); const prev=N[Math.max(0,i-1)]; save(); notesSheet(p.id,prev.id); return; }
  save(); notesSheet(p.id,nid);
}

  const p=P(ctx&&ctx.notes); if(!p) return; const N=p.notes, i=N.findIndex(x=>x.id===t.dataset.nid); if(i<0) return;
  if(e.key==='Enter'){ e.preventDefault(); const kids=i+1<N.length&&N[i+1].l>N[i].l&&!N[i].c; const at=kids?i+1:nBlock(N,i)+1; const nx={id:'n'+Date.now(),t:'',l:kids?N[i].l+1:N[i].l}; N.splice(at,0,nx); save(); notesSheet(p.id,nx.id); }

    }
    lastPull=maxTs; persist();
    if(changed){ S=fromRows(prev); migratePetites(); render(); }
    lastOk=Date.now(); syncErr=''; setSync(); return true;
  }catch(e){ syncErr=(e&&e.message)||String(e); setSync(); return false; }
}
function setSync(force){
  const el=document.getElementById('sync'); if(!el) return; let cls='ok', txt='✓', tip='Tout est enregistré';
  if(!navigator.onLine){ cls='off'; txt='hors ligne'+(dirty.size?' · '+dirty.size:''); tip='Hors ligne : les changements partiront au retour du réseau'; }
  else if(syncErr){ cls='err'; txt='⚠'+(dirty.size?' '+dirty.size:''); tip='Problème de synchro : '+syncErr; }
  else if(force==='sending'||dirty.size){ cls='pend'; txt='↻'+(dirty.size?' '+dirty.size:''); tip='Envoi en cours'; }
  el.className='sync '+cls; el.textContent=txt; el.title=tip;
}
function showLogin(msg){ booted=false; const l=document.getElementById('login'); l.hidden=false; const er=document.getElementById('l-err'); er.hidden=!msg; er.textContent=msg||''; try{ document.getElementById('l-mail').focus(); }catch(e){} }
async function enter(user){
  UID=user.id; EMAIL=user.email||''; document.getElementById('login').hidden=true;
  let c=null; try{ c=JSON.parse(localStorage.getItem(CK())||'null'); }catch(e){}
  if(c){ prev=c.prev||{}; dirty=new Set(c.dirty||[]); lastPull=c.lastPull||null; }
  S=fromRows(prev); booted=true; render(); setSync();
  const ok=await pull(!c);
  if(migratePetites()) render();
  if(ok&&!c&&!Object.keys(prev).length){ S.tags=DEFAULT_TAGS.map(([id,name],i)=>({id,name,o:i})); save(); render(); }
  push();
}
async function startApp(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ document.getElementById('view').innerHTML='<p class="empty">Impossible de charger l\'app. Recharge la page.</p>'; return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'etabli-auth'}});
  let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(session&&session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange((ev,sess)=>{ if(ev==='SIGNED_OUT'&&UID){ UID=null; showLogin(); } });
  addEventListener('online',()=>{ setSync(); pull().then(()=>push()); });
  addEventListener('offline',()=>setSync());
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&MINI){ $scrim.hidden=true; sheetKey=null; sheetId=null; ctx=null; draft=null; ui.view='mini'; try{ document.activeElement&&document.activeElement.blur(); }catch(e){} render(); window.scrollTo(0,0); } });
  document.addEventListener('visibilitychange',()=>{ if(!UID) return; if(document.visibilityState==='visible') pull().then(()=>push()); else push(); });
  setInterval(()=>{ if(UID&&document.visibilityState==='visible') pull(); },60000);
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); e.stopPropagation(); const b=document.getElementById('l-go'); b.disabled=true; b.textContent='Connexion…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('l-mail').value.trim(),password:document.getElementById('l-pass').value});
    if(error) throw error; await enter(data.user);
  }catch(err){ const m=String(err&&err.message||err); showLogin(/invalid/i.test(m)?'Adresse ou mot de passe incorrect.':!navigator.onLine?'Pas de réseau : la première connexion demande internet.':'Connexion impossible : '+m); }
  b.disabled=false; b.textContent='Se connecter';
},true);
const isStandalone=()=>{ try{ return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches; }catch(e){ return false; } };
const fsSupported=()=>!!(document.documentElement.requestFullscreen)&&!isStandalone();
const fsAuto=()=>{ try{ return localStorage.getItem('etabli-fs')==='1'; }catch(e){ return false; } };
function goFull(){ if(!fsSupported()||document.fullscreenElement) return; try{ const r=document.documentElement.requestFullscreen({navigationUI:'hide'}); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
document.addEventListener('pointerup',()=>{ if(fsAuto()) goFull(); },true);
function accountSheet(confirmOut){
  sheetId=null; ctx=null;
  const st=!navigator.onLine?'Hors ligne':syncErr?'Problème : '+syncErr:dirty.size?dirty.size+' changement'+(dirty.size>1?'s':'')+' en attente d\'envoi':'Tout est enregistré';
  const t=lastOk?new Date(lastOk).toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}):'—';
  openSheet(`<div class="shead"><h2>Synchro et compte<small>${esc(EMAIL)}</small></h2><button class="xbtn" data-act="close">Fermer</button></div><div class="sbody">
   <div class="bilan"><b>${esc(st)}</b><p>Dernier contact avec le serveur : ${t}</p></div>
   <button class="btn" data-act="syncNow">Synchroniser maintenant</button>
   <button class="btn ghost" data-act="exportData">Exporter mes données (fichier)</button>
   <button class="btn ghost" data-act="miniToggle">${MINI?'✓ Mode mini sur cet appareil : activé':'Mode mini sur cet appareil : désactivé'}</button>
   ${fsSupported()?`<div class="field"><span class="lbl">Sur cet appareil</span><button class="btn ghost" data-act="fsToggle">${fsAuto()?'✓ Plein écran automatique : activé':'Plein écran automatique : désactivé'}</button><p class="note" style="margin:0">Cache la barre du navigateur dès que tu touches l'écran. Utile si le navigateur n'ouvre pas l'app en plein écran tout seul.</p></div>`:''}
   ${confirmOut?`<div class="danger"><div>${dirty.size?'<b>'+dirty.size+' changement'+(dirty.size>1?'s':'')+' pas encore envoyé'+(dirty.size>1?'s':'')+'</b> seraient perdus. ':''}Se déconnecter de cet appareil ?</div><div class="actions"><button class="btn ghost" data-act="account">Annuler</button><button class="btn warn" data-act="logoutOk">Se déconnecter</button></div></div>`:`<button class="linkbtn" style="align-self:center;color:var(--neg)" data-act="logout">Se déconnecter de cet appareil</button>`}
  </div>`,'acct');
}
document.addEventListener('click',async e=>{
  const el=e.target.closest&&e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
  if(a==='account') accountSheet();
  else if(a==='logout') accountSheet(true);
  else if(a==='miniToggle'&&!$scrim.hidden) accountSheet();
  else if(a==='fsToggle'){ const on=!fsAuto(); try{ localStorage.setItem('etabli-fs',on?'1':'0'); }catch(err){} if(on) goFull(); else if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(err){} } accountSheet(); }
  else if(a==='syncNow'){ el.disabled=true; el.textContent='Synchro…'; await push(); await pull(true); await push(); accountSheet(); toast(syncErr?'Problème de synchro':'Synchronisé'); }
  else if(a==='exportData'){ const blob=new Blob([JSON.stringify({app:'etabli',version:1,exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='etabli-'+todayS+'.json'; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(u); l.remove();},1000); }
  else if(a==='logoutOk'){ try{ localStorage.removeItem(CK()); }catch(err){} UID=null; try{ await sb.auth.signOut(); }catch(err){} location.reload(); }
});

applyMode();
startApp();
})();
</script>
